# Development profile - in-memory H2 database for local development
spring.datasource.url=jdbc:h2:file:./data/educonnect;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Allow H2 console for local debugging (only enable in dev profile)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Local JWT secret for dev (DO NOT USE IN PRODUCTION)
jwt.secret=dev_jwt_secret_abcdefghijklmnopqrstuvwxyz012345

# CORS for local frontend dev server
app.cors.allowed-origins=http://localhost:5173,http://localhost:5174
