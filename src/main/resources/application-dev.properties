# Development profile - in-memory H2 database for local development
spring.datasource.url=jdbc:h2:mem:educonnect;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Allow H2 console for local debugging (only enable in dev profile)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Local JWT secret for dev (DO NOT USE IN PRODUCTION)
jwt.secret=dev_jwt_secret_abcdefghijklmnopqrstuvwxyz012345

# CORS for local frontend dev server
app.cors.allowed-origins=http://localhost:5173
